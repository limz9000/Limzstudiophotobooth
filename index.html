<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Limz Studio Photobooth — Cloud Foto & Galeri Event</title>
  
  <!-- Identitas & Metadata PWA (Mobile Web App Standalone) -->
  <meta name="description" content="Aplikasi Photobooth & Galeri Cloud Foto Event Profesional by Limz Studio">
  <meta name="theme-color" content="#0c0a08">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Limz Photobooth">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Favicon Mewah (Royal Gold Camera SVG) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z'/><circle cx='12' cy='13' r='4'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180' fill='%230c0a08'><rect width='180' height='180' rx='36' fill='%230c0a08'/><path d='M140 130a10 10 0 0 1-10 10H50a10 10 0 0 1-10-10V70a10 10 0 0 1 10-10h20l10-15h40l10 15h20a10 10 0 0 1 10 10z' fill='none' stroke='%23d4af37' stroke-width='8'/><circle cx='90' cy='100' r='25' fill='none' stroke='%23d4af37' stroke-width='8'/></svg>">

  <style>
    /* RESET & FULLSCREEN FOUNDATION */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0c0a08;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f5eedb;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
    }

    /* BINGKAI IFRAME LAYAR PENUH (SEAMLESS) */
    #gas-frame {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      outline: none;
      display: block;
      background-color: #0c0a08;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
    }

    /* LOADING SPLASH SCREEN (ROYAL GOLD & OBSIDIAN DARK) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: radial-gradient(circle at center, #1b1510 0%, #0c0a08 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
      padding: 24px;
      text-align: center;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* LOGO & EMBLIM MEWAH BERGETAR HALUS */
    .brand-emblem {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.03));
      border: 1px solid rgba(212, 175, 55, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.2);
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    .brand-emblem svg {
      width: 36px;
      height: 36px;
      stroke: #d4af37;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff2cc 0%, #d4af37 60%, #aa8214 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #a89885;
      letter-spacing: 0.8px;
      margin-bottom: 28px;
    }

    /* PROGRESS BAR BERKILAU */
    .progress-bar-container {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-indicator {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #aa8214, #d4af37, #fdf4d7, #d4af37);
      border-radius: 99px;
      position: absolute;
      top: 0;
      left: -40%;
      animation: shimmerLoading 1.6s infinite ease-in-out;
    }

    .loading-hint {
      margin-top: 16px;
      font-size: 11px;
      color: #6d6356;
      letter-spacing: 0.5px;
    }

    /* ANIMASI */
    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.15);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 32px rgba(212, 175, 55, 0.35);
      }
    }

    @keyframes shimmerLoading {
      0% {
        left: -40%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- LAYAR PEMUAT MEWAH (Mencegah Layar Putih Kosong saat Apps Script Cold Start) -->
  <div id="splash-screen">
    <div class="brand-emblem">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </div>
    <h1 class="brand-title">Limz Studio Photobooth</h1>
    <p class="brand-subtitle">Memuat Sistem Cloud Foto & Event...</p>
    
    <div class="progress-bar-container">
      <div class="progress-bar-indicator"></div>
    </div>
    
    <p class="loading-hint">Menghubungkan ke Google Cloud Server</p>
  </div>

  <!-- IFRAME PEMBUNGKUS UTAMA -->
  <!-- Lengkap dengan izin kamera HP, webcam, capture card DSLR HDMI, layar penuh, & clipboard -->
  <iframe 
    id="gas-frame" 
    src=""
    title="Limz Studio Photobooth"
    allow="camera; microphone; geolocation; display-capture; clipboard-read; clipboard-write; fullscreen; autoplay; web-share"
    allowfullscreen="true"
    webkitallowfullscreen="true"
    mozallowfullscreen="true">
  </iframe>

  <script>
    (function() {
      // URL Web App Resmi Google Apps Script Anda
      var BASE_GAS_URL = "https://script.google.com/macros/s/AKfycbxUzK9ZvwEhShBI4BDwNgau9aYIUH-XcMwVeIZX73OJwFhJTN0EnA28Cb2Z_p8qb93LVg/exec";
      
      var frame = document.getElementById("gas-frame");
      var splash = document.getElementById("splash-screen");

      // Teruskan parameter query string (?event=... &page=...) dan hash (#...) jika pengunjung membuka link spesifik
      var currentSearch = window.location.search;
      var currentHash = window.location.hash;
      var targetUrl = BASE_GAS_URL;

      if (currentSearch) {
        targetUrl += (targetUrl.indexOf("?") === -1 ? "?" : "&") + currentSearch.substring(1);
      }
      if (currentHash) {
        targetUrl += currentHash;
      }

      // Set URL ke iframe
      frame.src = targetUrl;

      // Sembunyikan splash screen begitu iframe berhasil memuat halaman
      var splashHidden = false;
      function hideSplash() {
        if (!splashHidden) {
          splashHidden = true;
          splash.classList.add("hidden");
        }
      }

      frame.addEventListener("load", function() {
        // Berikan sedikit jeda transisi halus
        setTimeout(hideSplash, 350);
      });

      // Batas waktu pengaman: jika event load terhalang sandbox, hilangkan splash maksimal dalam 5 detik
      setTimeout(hideSplash, 5000);

      // Sinkronisasi tinggi layar di browser mobile (Safari/Chrome baris alamat dinamis)
      function syncHeight() {
        var vh = window.innerHeight;
        document.documentElement.style.setProperty("--vh", vh + "px");
      }
      window.addEventListener("resize", syncHeight);
      window.addEventListener("orientationchange", syncHeight);
      syncHeight();
    })();
  </script>
</body>
</html>
