<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Limz Studio Photobooth - Management System & Guest Gallery</title>

  <!-- PWA & Mobile Web Capabilities -->
  <meta name="theme-color" content="#0b0f19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Limz Photobooth">
  <meta name="description" content="Limz Studio Photobooth - Cloud Foto, Live Monitor Slideshow, dan Galeri Event Instan.">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fullscreen Responsive Iframe */
    #gas-app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      z-index: 10;
      background-color: #0b0f19;
      display: block;
    }

    /* Branded Modern Loading Screen */
    #wrapper-loader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #151b26 0%, #0b0f19 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.45s ease, visibility 0.45s ease;
      padding: 20px;
    }

    #wrapper-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 380px;
    }

    .loader-brand-icon {
      font-size: 38px;
      color: #d49438;
      margin-bottom: 12px;
      animation: pulse-glow 2s infinite ease-in-out;
    }

    .loader-brand-title {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #ffffff;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .loader-brand-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 26px;
    }

    .spinner-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(212, 148, 56, 0.18);
      border-top-color: #d49438;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 18px;
    }

    .loader-status-text {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Fallback Direct Access Button */
    .fallback-box {
      margin-top: 24px;
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .btn-fallback {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212, 148, 56, 0.5);
      color: #d49438;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-fallback:hover {
      background: #d49438;
      color: #151b26;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(212, 148, 56, 0.4)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 18px rgba(212, 148, 56, 0.8)); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Loading Screen Berpenampilan Elegan -->
  <div id="wrapper-loader">
    <div class="loader-content">
      <div class="loader-brand-icon">❖</div>
      <h1 class="loader-brand-title">LIMZ STUDIO</h1>
      <p class="loader-brand-subtitle">PHOTOBOOTH SYSTEM</p>
      
      <div class="spinner-ring"></div>
      <p id="loader-status" class="loader-status-text">Menghubungkan ke server cloud...</p>

      <!-- Tombol bantuan jika browser memblokir cookie pihak ketiga -->
      <div id="fallback-box" class="fallback-box">
        <a id="direct-link-btn" href="#" target="_blank" rel="noopener" class="btn-fallback">
          ↗ Buka Langsung Tanpa Iframe
        </a>
      </div>
    </div>
  </div>

  <!-- Fullscreen Iframe Controller -->
  <iframe
    id="gas-app-frame"
    src=""
    allow="camera *; microphone *; clipboard-read *; clipboard-write *; fullscreen *; display-capture *; web-share *"
    allowfullscreen="true"
    webkitallowfullscreen="true"
    mozallowfullscreen="true">
  </iframe>

  <script>
    (function() {
      // Base URL resmi Google Apps Script Web App
      var GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbzeodgb__ikusUg4oWnBgeBLh_8x2DlAfPff-OfRPgLovbxw1pwl2m1DAGw9ANHA2yKOA/exec';

      var iframe = document.getElementById('gas-app-frame');
      var loader = document.getElementById('wrapper-loader');
      var loaderStatus = document.getElementById('loader-status');
      var fallbackBox = document.getElementById('fallback-box');
      var directBtn = document.getElementById('direct-link-btn');

      // Ambil seluruh parameter query string (?slug=...&view=...&photoId=...) dan hash
      var searchParams = window.location.search || '';
      var hashParams = window.location.hash || '';

      // Rakit URL tujuan dengan meneruskan seluruh parameter
      var targetUrl = GAS_EXEC_URL;
      if (searchParams) {
        targetUrl += (targetUrl.indexOf('?') > -1 ? '&' : '?') + searchParams.replace(/^\?/, '');
      }
      if (hashParams) {
        targetUrl += hashParams;
      }

      if (directBtn) {
        directBtn.href = targetUrl;
      }

      // Event listener saat iframe selesai memuat
      var isLoaded = false;
      function hideLoader() {
        if (!isLoaded) {
          isLoaded = true;
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() {
              loader.style.display = 'none';
            }, 500);
          }
        }
      }

      iframe.onload = function() {
        hideLoader();
      };

      // Tampilkan tombol alternatif jika jaringan lambat / dibatasi browser (> 6 detik)
      setTimeout(function() {
        if (!isLoaded) {
          if (loaderStatus) {
            loaderStatus.innerText = 'Memuat memerlukan waktu lebih lama...';
          }
          if (fallbackBox) {
            fallbackBox.style.display = 'block';
          }
        }
      }, 6000);

      // Mulai memuat iframe
      iframe.src = targetUrl;
    })();
  </script>
</body>
</html>
